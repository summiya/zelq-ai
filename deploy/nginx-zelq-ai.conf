# ZELQ AI — dedicated static vhost, prior to HTTPS (Certbot adds TLS).
# Ensure this domain does not already have an Nginx server block.
server {
    listen 80;
    server_name zelqai.com www.zelqai.com;

    root /var/www/zelq-ai;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
